services:
  db:
    image: postgres:16
    container_name: skypro_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7
    container_name: skypro_redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  web:
    build: .
    container_name: skypro_web
    command: >
      sh -c "echo 'Waiting for PostgreSQL at $$HOST:$$PORT...';
      until pg_isready -h $$HOST -p $$PORT -U $$USER > /dev/null 2>&1; do
        echo 'PostgreSQL is not ready yet, waiting...';
        sleep 2;
      done;
      echo 'PostgreSQL is ready.';
      python manage.py migrate --noinput;
      python manage.py collectstatic --noinput || echo 'collectstatic failed, skipping';
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      HOST: db
      PORT: 5432
      USER: ${USER}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build: .
    container_name: skypro_celery_worker
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build: .
    container_name: skypro_celery_beat
    command: celery -A config beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
