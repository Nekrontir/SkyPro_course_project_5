[project]
name = "skypro-course-project-5"
version = "0.1.0"
description = ""
authors = [
    {name = "Viktor",email = "klarkkent0314@gmail.com"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "redis (>=8.0.0,<9.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "coverage (>=7.14.1,<8.0.0)"
]

[tool.black]
line-length = 119
target-version = ['py313', 'py314']

[tool.isort]
profile = "black"
line_length = 119
